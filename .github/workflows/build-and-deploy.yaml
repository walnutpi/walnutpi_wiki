name: Build and Deploy

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      force_clean:
        description: '强制清理所有缓存'
        type: boolean
        default: false

env:
  NODE_VERSION: '18'
  DOCKER_IMAGE: 'node:18-alpine'

jobs:
  # ==================== 环境检查 ====================
  check-secrets:
    name: 检查部署配置
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    outputs:
      secrets_configured: ${{ steps.check.outputs.configured }}
      missing_secrets: ${{ steps.check.outputs.missing }}
    steps:
      - name: 检查必需的Secrets
        id: check
        env:
          SECRET_SSH_KEY: ${{ secrets.SERVER_SSH_KEY || '' }}
          SECRET_HOST: ${{ secrets.SERVER_HOST || '' }}
          SECRET_USER: ${{ secrets.SERVER_USER || '' }}
          SECRET_PATH: ${{ secrets.SERVER_TARGET_PATH || '' }}
        run: |
          MISSING=()
          
          echo "========================================"
          echo "🔍 检查部署配置"
          echo "========================================"
          
          if [ -z "$SECRET_SSH_KEY" ]; then
            MISSING+=("SERVER_SSH_KEY")
            echo "❌ 缺失: SERVER_SSH_KEY"
          else
            echo "✅ 已配置: SERVER_SSH_KEY (长度: ${#SECRET_SSH_KEY} 字符)"
          fi
          
          if [ -z "$SECRET_HOST" ]; then
            MISSING+=("SERVER_HOST")
            echo "❌ 缺失: SERVER_HOST"
          else
            echo "✅ 已配置: SERVER_HOST"
          fi
          
          if [ -z "$SECRET_USER" ]; then
            MISSING+=("SERVER_USER")
            echo "❌ 缺失: SERVER_USER"
          else
            echo "✅ 已配置: SERVER_USER"
          fi
          
          if [ -z "$SECRET_PATH" ]; then
            MISSING+=("SERVER_TARGET_PATH")
            echo "❌ 缺失: SERVER_TARGET_PATH"
          else
            echo "✅ 已配置: SERVER_TARGET_PATH"
          fi
          
          echo "========================================"
          
          if [ ${#MISSING[@]} -eq 0 ]; then
            echo "✅ 所有部署配置已就绪"
            echo "configured=true" >> $GITHUB_OUTPUT
            echo "missing=" >> $GITHUB_OUTPUT
          else
            echo "❌ 缺少以下配置: ${MISSING[*]}"
            echo "configured=false" >> $GITHUB_OUTPUT
            echo "missing=${MISSING[*]}" >> $GITHUB_OUTPUT
            
            echo ""
            echo "========================================"
            echo "📖 部署配置指南"
            echo "========================================"
            echo ""
            echo "请在 GitHub 仓库设置中添加以下 Secrets："
            echo "设置地址: https://github.com/${{ github.repository }}/settings/secrets/actions"
            echo ""
            echo "1. SERVER_SSH_KEY - 服务器SSH私钥"
            echo "   生成: ssh-keygen -t rsa -b 4096 -m PEM -C 'github-actions'"
            echo "   查看: cat ~/.ssh/id_rsa"
            echo ""
            echo "2. SERVER_HOST - 服务器地址"
            echo "   例如: 192.168.1.100 或 example.com"
            echo ""
            echo "3. SERVER_USER - SSH登录用户名"
            echo "   例如: root, ubuntu, deployer"
            echo ""
            echo "4. SERVER_TARGET_PATH - 部署目标路径"
            echo "   例如: /var/www/your-site/"
            echo "========================================"
          fi

  # ==================== 测试 SSH 连接 ====================
  test-ssh:
    name: 测试SSH连接
    runs-on: ubuntu-latest
    # ✅ 只在 check-secrets 运行且配置成功时执行
    needs: [check-secrets]
    if: |
      always() &&
      needs.check-secrets.result == 'success' &&
      needs.check-secrets.outputs.secrets_configured == 'true'
    steps:
      - name: 测试SSH连接
        env:
          SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
          HOST: ${{ secrets.SERVER_HOST }}
          USER: ${{ secrets.SERVER_USER }}
        run: |
          echo "========================================"
          echo "🔌 测试 SSH 连接"
          echo "========================================"
          echo "服务器: $HOST"
          echo "用户: $USER"
          echo ""
          
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/test_key
          chmod 600 ~/.ssh/test_key
          
          if ssh -o StrictHostKeyChecking=no -o ConnectTimeout=10 -i ~/.ssh/test_key ${USER}@${HOST} "echo '✅ SSH连接成功！' && whoami && pwd"; then
            echo "========================================"
            echo "✅ SSH 连接测试通过"
            echo "========================================"
          else
            echo "========================================"
            echo "❌ SSH 连接失败"
            echo "========================================"
            echo ""
            echo "请检查："
            echo "1. SERVER_SSH_KEY 是否正确（完整的私钥）"
            echo "2. SERVER_USER 是否正确"
            echo "3. 服务器上是否已添加公钥到 ~/.ssh/authorized_keys"
            echo "4. 服务器防火墙是否允许 SSH 连接"
            exit 1
          fi

  # ==================== 调试任务 ====================
  debug:
    name: 调试触发信息
    runs-on: ubuntu-latest
    steps:
      - name: 显示所有触发信息
        run: |
          echo "========================================"
          echo "📋 触发信息调试"
          echo "========================================"
          echo "事件类型: ${{ github.event_name }}"
          echo "分支: ${{ github.ref_name }}"
          echo "完整引用: ${{ github.ref }}"
          echo "提交: ${{ github.sha }}"
          echo "触发者: ${{ github.actor }}"
          echo "========================================"

  # ==================== 构建任务 ====================
  build:
    name: 构建项目
    needs: []
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # ✅ PR 评论所需权限
    permissions:
      contents: read
      issues: write
      pull-requests: write
    
    outputs:
      build_duration: ${{ steps.build.outputs.duration }}
      build_status: ${{ steps.build.outputs.status }}
      build_size: ${{ steps.build.outputs.size }}
      commit_hash: ${{ steps.vars.outputs.commit_hash }}
      short_hash: ${{ steps.vars.outputs.short_hash }}
      build_date: ${{ steps.vars.outputs.build_date }}
      build_id: ${{ steps.vars.outputs.build_id }}
      
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          
      - name: 生成构建标识
        id: vars
        run: |
          SHORT_HASH=$(git rev-parse --short=7 HEAD)
          FULL_HASH=$(git rev-parse HEAD)
          BUILD_DATE=$(date '+%Y%m%d-%H%M%S')
          BUILD_ID="${BUILD_DATE}-${SHORT_HASH}"
          
          echo "short_hash=${SHORT_HASH}" >> $GITHUB_OUTPUT
          echo "commit_hash=${FULL_HASH}" >> $GITHUB_OUTPUT
          echo "build_date=${BUILD_DATE}" >> $GITHUB_OUTPUT
          echo "build_id=${BUILD_ID}" >> $GITHUB_OUTPUT
          
          echo "========================================"
          echo "🏗️ 构建信息"
          echo "========================================"
          echo "构建ID: ${BUILD_ID}"
          echo "提交: ${SHORT_HASH}"
          echo "========================================"
          
      - name: 显示环境信息
        run: |
          echo "========================================"
          echo "系统环境"
          echo "========================================"
          echo "CPU核心: $(nproc)"
          echo "内存: $(free -h | grep Mem | awk '{print $2}')"
          echo "磁盘: $(df -h / | awk 'NR==2 {print $4}')"
          echo "========================================"
          
      - name: 缓存node_modules
        uses: actions/cache@v3
        id: npm-cache
        with:
          path: |
            node_modules
            ~/.npm
          # ✅ 移除 .docusaurus 缓存，避免权限问题
          key: ${{ runner.os }}-node-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-
            
      - name: 清理缓存（手动触发）
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.force_clean == 'true'
        run: |
          echo "🧹 强制清理缓存..."
          rm -rf node_modules .docusaurus 2>/dev/null || true
          docker system prune -f 2>/dev/null || true
          
      - name: 拉取Docker镜像
        run: |
          docker pull ${{ env.DOCKER_IMAGE }}
          
      - name: 执行构建
        id: build
        run: |
          BUILD_START=$(date +%s)
          
          docker run \
            --rm \
            -v $(pwd):/usr/src/app \
            -w /usr/src/app \
            ${{ env.DOCKER_IMAGE }} \
            sh -c "npm install && npm run build"
          
          BUILD_END=$(date +%s)
          DURATION=$((BUILD_END - BUILD_START))
          
          echo "duration=${DURATION}" >> $GITHUB_OUTPUT
          
          if [ -d "build" ]; then
            SIZE=$(du -sh build | awk '{print $1}')
            echo "size=${SIZE}" >> $GITHUB_OUTPUT
            echo "status=success" >> $GITHUB_OUTPUT
            
            echo "========================================"
            echo "✅ 构建成功"
            echo "========================================"
            echo "产物大小: ${SIZE}"
            echo "耗时: ${DURATION}秒 ($(($DURATION / 60))分 $(($DURATION % 60))秒)"
            echo "========================================"
          else
            echo "status=failed" >> $GITHUB_OUTPUT
            echo "❌ 构建失败：未找到build目录"
            exit 1
          fi
          
      - name: 修复文件权限
        if: steps.build.outputs.status == 'success'
        run: |
          echo "修复文件权限..."
          sudo chown -R $(id -u):$(id -g) node_modules build 2>/dev/null || true
          chmod -R 755 build/ 2>/dev/null || true
          echo "✅ 权限已修复"
          
      - name: 生成构建元数据
        if: steps.build.outputs.status == 'success'
        run: |
          mkdir -p build/.meta
          cat > build/.meta/build-info.json << EOF
          {
            "build_id": "${{ steps.vars.outputs.build_id }}",
            "commit_hash": "${{ steps.vars.outputs.commit_hash }}",
            "short_hash": "${{ steps.vars.outputs.short_hash }}",
            "build_date": "${{ steps.vars.outputs.build_date }}",
            "branch": "${{ github.ref_name }}",
            "duration": "${{ steps.build.outputs.duration }}",
            "size": "${{ steps.build.outputs.size }}",
            "trigger": "${{ github.event_name }}",
            "actor": "${{ github.actor }}"
          }
          EOF
          echo "✅ 元数据已生成"
          
      - name: 上传构建产物
        if: steps.build.outputs.status == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ steps.vars.outputs.build_id }}
          path: build/
          retention-days: ${{ github.event_name == 'pull_request' && 1 || 7 }}
          compression-level: 6
          
      - name: PR构建状态评论
        if: github.event_name == 'pull_request' && steps.build.outputs.status == 'success'
        uses: actions/github-script@v7
        with:
          script: |
            const buildId = '${{ steps.vars.outputs.build_id }}';
            const duration = '${{ steps.build.outputs.duration }}';
            const size = '${{ steps.build.outputs.size }}';
            const hash = '${{ steps.vars.outputs.short_hash }}';
            const message = `## ✅ 构建成功\n\n` +
              `| 指标 | 数值 |\n` +
              `|------|------|\n` +
              `| 构建ID | \`${buildId}\` |\n` +
              `| 提交 | \`${hash}\` |\n` +
              `| 构建耗时 | ${duration}秒 |\n` +
              `| 产物大小 | ${size} |\n\n` +
              `> 💡 可以合并此PR`;
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: message
            });

  # ==================== 部署任务 ====================
  deploy:
    name: 部署到生产环境
    # ✅ 依赖 build 和 check-secrets（确保 Secrets 已检查）
    needs: [build, check-secrets]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    # ✅ 完整条件：构建成功 + 事件匹配 + main分支 + Secrets已配置
    if: |
      needs.build.outputs.status == 'success' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      github.ref == 'refs/heads/main' &&
      needs.check-secrets.outputs.secrets_configured == 'true'
    
    steps:
      - name: 下载构建产物
        uses: actions/download-artifact@v4
        with:
          name: build-${{ needs.build.outputs.build_id }}
          path: build/
          
      - name: 验证产物完整性
        id: verify
        run: |
          echo "========================================"
          echo "📦 验证构建产物"
          echo "========================================"
          
          if [ ! -d "build" ]; then
            echo "❌ 错误: build 目录不存在"
            exit 1
          fi
          
          if [ -z "$(ls -A build)" ]; then
            echo "❌ 错误: build 目录为空"
            exit 1
          fi
          
          if [ ! -f "build/index.html" ]; then
            echo "⚠️ 警告: 未找到 index.html"
          else
            echo "✅ 找到 index.html"
          fi
          
          FILE_COUNT=$(find build -type f | wc -l)
          TOTAL_SIZE=$(du -sh build | awk '{print $1}')
          
          echo "📊 产物统计:"
          echo "  - 文件数: $FILE_COUNT"
          echo "  - 总大小: $TOTAL_SIZE"
          
          echo "file_count=$FILE_COUNT" >> $GITHUB_OUTPUT
          echo "total_size=$TOTAL_SIZE" >> $GITHUB_OUTPUT
          
          echo "✅ 产物验证通过"
          echo "========================================"
          
      - name: 创建服务器备份
        env:
          SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
          HOST: ${{ secrets.SERVER_HOST }}
          USER: ${{ secrets.SERVER_USER }}
        run: |
          echo "========================================"
          echo "💾 创建服务器备份"
          echo "========================================"
          
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/deploy_key ${USER}@${HOST} << 'EOF'
            TARGET_PATH="${{ secrets.SERVER_TARGET_PATH }}"
            BACKUP_DIR="/tmp/backup_$(date +%Y%m%d_%H%M%S)"
            
            if [ -d "$TARGET_PATH" ] && [ "$(ls -A $TARGET_PATH 2>/dev/null)" ]; then
              echo "📦 备份当前版本到: $BACKUP_DIR"
              mkdir -p "$BACKUP_DIR"
              cp -r "$TARGET_PATH"/* "$BACKUP_DIR/" 2>/dev/null || true
              
              ls -dt /tmp/backup_* 2>/dev/null | tail -n +6 | xargs rm -rf 2>/dev/null || true
              echo "✅ 备份完成，保留最近5个备份"
            else
              echo "ℹ️ 目标目录为空或不存在，跳过备份"
            fi
          EOF
          
          echo "✅ 备份操作完成"
          echo "========================================"
          
      - name: 打包产物
        run: |
          BUILD_ID="${{ needs.build.outputs.build_id }}"
          tar -czf "build-${BUILD_ID}.tar.gz" build/
          echo "压缩包: build-${BUILD_ID}.tar.gz"
          echo "压缩包大小: $(du -h build-${BUILD_ID}.tar.gz | awk '{print $1}')"
          
      - name: 显示部署信息
        run: |
          echo "========================================"
          echo "🚀 开始部署"
          echo "========================================"
          echo "服务器: ${{ secrets.SERVER_HOST }}"
          echo "用户: ${{ secrets.SERVER_USER }}"
          echo "路径: ${{ secrets.SERVER_TARGET_PATH }}"
          echo "构建ID: ${{ needs.build.outputs.build_id }}"
          echo "提交: ${{ needs.build.outputs.short_hash }}"
          echo "触发方式: ${{ github.event_name }}"
          echo "触发者: ${{ github.actor }}"
          echo "========================================"
          
      - name: 部署到服务器
        uses: easingthemes/ssh-deploy@main
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SERVER_SSH_KEY }}
          ARGS: "-avzr --delete"
          SOURCE: "build/"
          REMOTE_HOST: ${{ secrets.SERVER_HOST }}
          REMOTE_USER: ${{ secrets.SERVER_USER }}
          TARGET: ${{ secrets.SERVER_TARGET_PATH }}
          EXCLUDE: "/.git/, /.env, /.meta/"
          
      - name: 部署后验证
        env:
          SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
          HOST: ${{ secrets.SERVER_HOST }}
          USER: ${{ secrets.SERVER_USER }}
        run: |
          echo "========================================"
          echo "🔍 部署后验证"
          echo "========================================"
          
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/deploy_key ${USER}@${HOST} << 'EOF'
            TARGET_PATH="${{ secrets.SERVER_TARGET_PATH }}"
            
            if [ ! -d "$TARGET_PATH" ]; then
              echo "❌ 错误: 目标目录不存在"
              exit 1
            fi
            
            if [ -z "$(ls -A $TARGET_PATH)" ]; then
              echo "❌ 错误: 目标目录为空"
              exit 1
            fi
            
            FILE_COUNT=$(find $TARGET_PATH -type f 2>/dev/null | wc -l)
            TOTAL_SIZE=$(du -sh $TARGET_PATH 2>/dev/null | awk '{print $1}')
            
            echo "📊 服务器上部署状态:"
            echo "  - 文件数: $FILE_COUNT"
            echo "  - 总大小: $TOTAL_SIZE"
            
            if [ -f "$TARGET_PATH/index.html" ]; then
              echo "  ✅ index.html 存在"
            else
              echo "  ⚠️ 警告: index.html 不存在"
            fi
            
            echo "✅ 部署验证通过"
          EOF
          
          echo "========================================"
          
      - name: 创建 Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BUILD_ID="${{ needs.build.outputs.build_id }}"
          COMMIT_MSG=$(git log -1 --pretty=%B | head -1)
          COMMIT_URL="https://github.com/${{ github.repository }}/commit/${{ needs.build.outputs.commit_hash }}"
          
          # ✅ 如果 Release 已存在，先删除再创建
          if gh release view "$BUILD_ID" --repo "${{ github.repository }}" 2>/dev/null; then
            echo "⚠️ Release $BUILD_ID 已存在，删除旧版本..."
            gh release delete "$BUILD_ID" --repo "${{ github.repository }}" -y 2>/dev/null || true
          fi
          
          gh release create \
            "$BUILD_ID" \
            "build-${BUILD_ID}.tar.gz" \
            --repo "${{ github.repository }}" \
            --title "Build $BUILD_ID" \
            --notes "## 🚀 自动部署 Release
            
            ### 📦 构建信息
            | 项目 | 详情 |
            |------|------|
            | 构建ID | \`$BUILD_ID\` |
            | 提交 | [\`${{ needs.build.outputs.short_hash }}\`]($COMMIT_URL) |
            | 提交信息 | $COMMIT_MSG |
            | 耗时 | ${{ needs.build.outputs.build_duration }}秒 |
            | 产物大小 | ${{ needs.build.outputs.build_size }} |
            | 触发者 | @${{ github.actor }} |
            | 触发方式 | ${{ github.event_name }} |
            
            ### 🌐 部署信息
            | 项目 | 详情 |
            |------|------|
            | 服务器 | ${{ secrets.SERVER_HOST }} |
            | 路径 | ${{ secrets.SERVER_TARGET_PATH }} |
            | 状态 | ✅ 部署成功 |
            
            ---
            > 🔗 [查看部署记录](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})"
          
          echo "✅ Release 已创建"

  # ==================== 清理任务 ====================
  cleanup:
    name: 清理资源
    # ✅ 依赖 build，不依赖 deploy（无论部署是否成功都清理）
    needs: [build]
    runs-on: ubuntu-latest
    if: always()
    
    steps:
      - name: 清理Docker
        run: |
          docker system prune -f 2>/dev/null || true
          echo "✅ 清理完成"
          
      - name: 生成报告
        if: success()
        run: |
          echo "## 📊 部署报告" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| 项目 | 详情 |" >> $GITHUB_STEP_SUMMARY
          echo "|------|------|" >> $GITHUB_STEP_SUMMARY
          echo "| 构建ID | \`${{ needs.build.outputs.build_id }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| 状态 | ✅ 成功 |" >> $GITHUB_STEP_SUMMARY
          echo "| 耗时 | ${{ needs.build.outputs.build_duration }}秒 |" >> $GITHUB_STEP_SUMMARY
          echo "| 产物 | ${{ needs.build.outputs.build_size }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "> 🎉 部署完成！" >> $GITHUB_STEP_SUMMARY