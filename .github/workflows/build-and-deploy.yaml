name: Build and Deploy

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      force_clean:
        description: '强制清理所有缓存（首次构建模式）'
        type: boolean
        default: false

env:
  NODE_VERSION: '24'
  DOCKER_IMAGE: 'node:24-alpine'
  BUILD_PATH: 'build'

jobs:
  # ==================== 调试任务 ====================
  debug:
    name: 调试触发信息
    runs-on: ubuntu-22.04
    steps:
      - name: 显示所有触发信息
        run: |
          echo "========================================"
          echo "📋 触发信息调试"
          echo "========================================"
          echo "事件类型: ${{ github.event_name }}"
          echo "分支: ${{ github.ref_name }}"
          echo "完整引用: ${{ github.ref }}"
          echo "提交: ${{ github.sha }}"
          echo "触发者: ${{ github.actor }}"
          echo "========================================"

  # ==================== 构建 + 部署（合并） ====================
  build-and-deploy:
    name: 构建并部署
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    permissions:
      issues: write
      pull-requests: write

    if: |
      github.event_name == 'push' ||
      github.event_name == 'pull_request' ||
      github.event_name == 'workflow_dispatch'

    steps:
      # ---------- 1. 检出代码 ----------
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ---------- 2. 生成构建标识 ----------
      - name: 生成构建标识
        id: vars
        run: |
          SHORT_HASH=$(git rev-parse --short=7 HEAD)
          FULL_HASH=$(git rev-parse HEAD)
          BUILD_DATE=$(date '+%Y%m%d-%H%M%S')
          BUILD_ID="${BUILD_DATE}-${SHORT_HASH}"

          echo "short_hash=${SHORT_HASH}" >> $GITHUB_OUTPUT
          echo "commit_hash=${FULL_HASH}" >> $GITHUB_OUTPUT
          echo "build_date=${BUILD_DATE}" >> $GITHUB_OUTPUT
          echo "build_id=${BUILD_ID}" >> $GITHUB_OUTPUT

          echo "========================================"
          echo "🏗️ 构建信息"
          echo "========================================"
          echo "构建ID: ${BUILD_ID}"
          echo "提交: ${SHORT_HASH}"
          echo "========================================"

      # ---------- 3. 显示环境信息 ----------
      - name: 显示环境信息
        run: |
          echo "========================================"
          echo "系统环境"
          echo "========================================"
          echo "CPU核心: $(nproc)"
          echo "内存: $(free -h | grep Mem | awk '{print $2}')"
          echo "磁盘: $(df -h / | awk 'NR==2 {print $4}')"
          echo "========================================"

      # ---------- 4. 检查 Secrets（仅 push/手动触发） ----------
      - name: 检查部署配置
        id: check-secrets
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        env:
          SECRET_SSH_KEY: ${{ secrets.SERVER_SSH_KEY || '' }}
          SECRET_HOST: ${{ secrets.SERVER_HOST || '' }}
          SECRET_USER: ${{ secrets.SERVER_USER || '' }}
          SECRET_PATH: ${{ secrets.SERVER_TARGET_PATH || '' }}
        run: |
          MISSING=()

          echo "========================================"
          echo "🔍 检查部署配置"
          echo "========================================"

          if [ -z "$SECRET_SSH_KEY" ]; then
            MISSING+=("SERVER_SSH_KEY")
            echo "❌ 缺失: SERVER_SSH_KEY"
          else
            echo "✅ 已配置: SERVER_SSH_KEY (长度: ${#SECRET_SSH_KEY} 字符)"
          fi

          if [ -z "$SECRET_HOST" ]; then
            MISSING+=("SERVER_HOST")
            echo "❌ 缺失: SERVER_HOST"
          else
            echo "✅ 已配置: SERVER_HOST"
          fi

          if [ -z "$SECRET_USER" ]; then
            MISSING+=("SERVER_USER")
            echo "❌ 缺失: SERVER_USER"
          else
            echo "✅ 已配置: SERVER_USER"
          fi

          if [ -z "$SECRET_PATH" ]; then
            MISSING+=("SERVER_TARGET_PATH")
            echo "❌ 缺失: SERVER_TARGET_PATH"
          else
            echo "✅ 已配置: SERVER_TARGET_PATH"
          fi

          echo "========================================"

          if [ ${#MISSING[@]} -eq 0 ]; then
            echo "✅ 所有部署配置已就绪"
            echo "secrets_configured=true" >> $GITHUB_OUTPUT
          else
            echo "❌ 缺少以下配置: ${MISSING[*]}"
            echo "secrets_configured=false" >> $GITHUB_OUTPUT

            echo ""
            echo "========================================"
            echo "📖 部署配置指南"
            echo "========================================"
            echo ""
            echo "请在 GitHub 仓库设置中添加以下 Secrets："
            echo "设置地址: https://github.com/${{ github.repository }}/settings/secrets/actions"
            echo ""
            echo "1. SERVER_SSH_KEY - 服务器SSH私钥"
            echo "   生成: ssh-keygen -t rsa -b 4096 -m PEM -C 'github-actions'"
            echo "   查看: cat ~/.ssh/id_rsa"
            echo ""
            echo "2. SERVER_HOST - 服务器地址"
            echo "   例如: 192.168.1.100 或 example.com"
            echo ""
            echo "3. SERVER_USER - SSH登录用户名"
            echo "   例如: root, ubuntu, deployer"
            echo ""
            echo "4. SERVER_TARGET_PATH - 部署目标路径"
            echo "   例如: /var/www/your-site/"
            echo "========================================"
          fi

      # ---------- 5. 测试 SSH 连接（仅 push/手动触发且 Secrets 已配置） ----------
      - name: 测试 SSH 连接
        if: |
          (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
          steps.check-secrets.outputs.secrets_configured == 'true'
        env:
          SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
          HOST: ${{ secrets.SERVER_HOST }}
          USER: ${{ secrets.SERVER_USER }}
        run: |
          echo "========================================"
          echo "🔌 测试 SSH 连接"
          echo "========================================"
          echo "服务器: $HOST"
          echo "用户: $USER"
          echo ""

          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/test_key
          chmod 600 ~/.ssh/test_key

          if ssh -o StrictHostKeyChecking=no -o ConnectTimeout=10 -i ~/.ssh/test_key ${USER}@${HOST} "echo '✅ SSH连接成功！' && whoami && pwd"; then
            echo "========================================"
            echo "✅ SSH 连接测试通过"
            echo "========================================"
          else
            echo "========================================"
            echo "❌ SSH 连接失败"
            echo "========================================"
            exit 1
          fi

      # ---------- 6. 缓存 Docker 镜像 ----------
      - name: 缓存 Docker 镜像
        uses: actions/cache@v3
        id: docker-cache
        with:
          path: /tmp/docker-cache
          key: docker-${{ env.DOCKER_IMAGE }}
          restore-keys: |
            docker-${{ env.DOCKER_IMAGE }}

      - name: 加载 Docker 镜像缓存
        if: steps.docker-cache.outputs.cache-hit == 'true'
        run: |
          if [ -f /tmp/docker-cache/node-image.tar ]; then
            docker load < /tmp/docker-cache/node-image.tar
            echo "✅ Docker 镜像从缓存加载"
          fi

      # ---------- 7. 缓存依赖 ----------
      - name: 缓存 node_modules
        uses: actions/cache@v3
        id: npm-cache
        with:
          path: |
            node_modules
            ~/.npm
            .docusaurus
          key: ${{ runner.os }}-docusaurus-${{ hashFiles('package-lock.json', 'docusaurus.config.js') }}
          restore-keys: |
            ${{ runner.os }}-docusaurus-${{ hashFiles('package-lock.json') }}
            ${{ runner.os }}-docusaurus-

      # ---------- 8. 清理缓存（手动触发） ----------
      - name: 清理缓存
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.force_clean == 'true'
        run: |
          echo "🧹 强制清理缓存..."
          rm -rf node_modules .docusaurus 2>/dev/null || true
          docker system prune -f 2>/dev/null || true
          rm -rf /tmp/docker-cache/* 2>/dev/null || true

      # ---------- 9. 拉取 Docker 镜像 ----------
      - name: 拉取 Docker 镜像
        run: |
          docker pull ${{ env.DOCKER_IMAGE }}

      - name: 保存 Docker 镜像缓存
        if: steps.docker-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p /tmp/docker-cache
          docker save ${{ env.DOCKER_IMAGE }} -o /tmp/docker-cache/node-image.tar
          echo "✅ Docker 镜像已缓存"

      # ---------- 10. 执行构建 ----------
      - name: 执行构建
        id: build
        run: |
          BUILD_START=$(date +%s)

          docker run \
            --rm \
            -v $(pwd):/usr/src/app \
            -w /usr/src/app \
            ${{ env.DOCKER_IMAGE }} \
            sh -c "npm install && npm run build"

          BUILD_END=$(date +%s)
          DURATION=$((BUILD_END - BUILD_START))

          echo "duration=${DURATION}" >> $GITHUB_OUTPUT

          if [ -d "${{ env.BUILD_PATH }}" ]; then
            SIZE=$(du -sh ${{ env.BUILD_PATH }} | awk '{print $1}')
            echo "size=${SIZE}" >> $GITHUB_OUTPUT
            echo "status=success" >> $GITHUB_OUTPUT

            echo "========================================"
            echo "✅ 构建成功"
            echo "========================================"
            echo "产物大小: ${SIZE}"
            echo "耗时: ${DURATION}秒 ($(($DURATION / 60))分 $(($DURATION % 60))秒)"
            echo "========================================"
          else
            echo "status=failed" >> $GITHUB_OUTPUT
            echo "❌ 构建失败：未找到 ${{ env.BUILD_PATH }} 目录"
            exit 1
          fi

      # ---------- 11. 修复文件权限 ----------
      - name: 修复文件权限
        if: steps.build.outputs.status == 'success'
        run: |
          echo "修复文件权限..."
          sudo chown -R $(id -u):$(id -g) .docusaurus node_modules ${{ env.BUILD_PATH }} 2>/dev/null || true
          chmod -R 755 ${{ env.BUILD_PATH }}/ 2>/dev/null || true
          echo "✅ 权限已修复"

      # ---------- 12. 生成构建元数据 ----------
      - name: 生成构建元数据
        if: steps.build.outputs.status == 'success'
        run: |
          mkdir -p ${{ env.BUILD_PATH }}/.meta
          cat > ${{ env.BUILD_PATH }}/.meta/build-info.json << EOF
          {
            "build_id": "${{ steps.vars.outputs.build_id }}",
            "commit_hash": "${{ steps.vars.outputs.commit_hash }}",
            "short_hash": "${{ steps.vars.outputs.short_hash }}",
            "build_date": "${{ steps.vars.outputs.build_date }}",
            "branch": "${{ github.ref_name }}",
            "duration": "${{ steps.build.outputs.duration }}",
            "size": "${{ steps.build.outputs.size }}",
            "trigger": "${{ github.event_name }}",
            "actor": "${{ github.actor }}"
          }
          EOF
          echo "✅ 元数据已生成"

      # ---------- 13. 记录构建指标 ----------
      - name: 记录构建指标
        if: steps.build.outputs.status == 'success'
        run: |
          cat > metrics.txt << EOF
          build_id: ${{ steps.vars.outputs.build_id }}
          build_time_seconds: ${{ steps.build.outputs.duration }}
          build_size: ${{ steps.build.outputs.size }}
          timestamp: $(date -Iseconds)
          runner: ${{ runner.os }}
          node_version: ${{ env.NODE_VERSION }}
          EOF
          echo "✅ 指标已记录"

      - name: 上传指标
        if: steps.build.outputs.status == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: metrics-${{ steps.vars.outputs.build_id }}
          path: metrics.txt
          retention-days: 30

      # ---------- 14. PR构建状态评论 ----------
      - name: PR构建状态评论
        if: |
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.fork == false &&
          steps.build.outputs.status == 'success'
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const buildId = '${{ steps.vars.outputs.build_id }}';
            const duration = '${{ steps.build.outputs.duration }}';
            const size = '${{ steps.build.outputs.size }}';
            const hash = '${{ steps.vars.outputs.short_hash }}';
            const message = `## ✅ 构建成功\n\n` +
              `| 指标 | 数值 |\n` +
              `|------|------|\n` +
              `| 构建ID | \`${buildId}\` |\n` +
              `| 提交 | \`${hash}\` |\n` +
              `| 构建耗时 | ${duration}秒 |\n` +
              `| 产物大小 | ${size} |\n\n` +
              `> 💡 可以合并此PR`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: message
            });

      # ========== 以下是部署相关步骤（只在 push/手动触发 + main 分支时执行） ==========

      # ---------- 15. 检查是否满足部署条件 ----------
      - name: 设置部署条件
        id: deploy-condition
        run: |
          SHOULD_DEPLOY="false"
          if [ "${{ github.event_name }}" == "push" ] || [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            if [ "${{ github.ref }}" == "refs/heads/main" ] || [ "${{ github.ref }}" == "refs/heads/master" ]; then
              if [ "${{ steps.build.outputs.status }}" == "success" ]; then
                if [ "${{ steps.check-secrets.outputs.secrets_configured }}" == "true" ]; then
                  SHOULD_DEPLOY="true"
                fi
              fi
            fi
          fi
          echo "should_deploy=${SHOULD_DEPLOY}" >> $GITHUB_OUTPUT

      # ---------- 16. 设置 SSH 密钥 ----------
      - name: 设置 SSH 密钥
        if: steps.deploy-condition.outputs.should_deploy == 'true'
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SERVER_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          echo "✅ SSH 密钥已设置"

      # ---------- 17. 显示部署信息 ----------
      - name: 显示部署信息
        if: steps.deploy-condition.outputs.should_deploy == 'true'
        run: |
          echo "========================================"
          echo "🚀 开始部署"
          echo "========================================"
          echo "服务器: ${{ secrets.SERVER_HOST }}"
          echo "用户: ${{ secrets.SERVER_USER }}"
          echo "路径: ${{ secrets.SERVER_TARGET_PATH }}"
          echo "构建ID: ${{ steps.vars.outputs.build_id }}"
          echo "提交: ${{ steps.vars.outputs.short_hash }}"
          echo "触发方式: ${{ github.event_name }}"
          echo "触发者: ${{ github.actor }}"
          echo "========================================"

      # ---------- 18. 部署到服务器 ----------
      - name: 部署到服务器
        if: steps.deploy-condition.outputs.should_deploy == 'true'
        id: rsync-deploy
        uses: easingthemes/ssh-deploy@main
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SERVER_SSH_KEY }}
          ARGS: "-rlgoDzvc --delete --progress"
          SOURCE: "${{ env.BUILD_PATH }}/"
          REMOTE_HOST: ${{ secrets.SERVER_HOST }}
          REMOTE_USER: ${{ secrets.SERVER_USER }}
          TARGET: ${{ secrets.SERVER_TARGET_PATH }}
          EXCLUDE: "/.git/, /.env, /.meta/"

      # ---------- 19. 部署后验证 ----------
      - name: 部署后验证
        if: steps.deploy-condition.outputs.should_deploy == 'true'
        run: |
          echo "========================================"
          echo "🔍 部署后验证"
          echo "========================================"

          ssh -o StrictHostKeyChecking=no -i ~/.ssh/deploy_key ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} << 'EOF'
            TARGET_PATH="${{ secrets.SERVER_TARGET_PATH }}"

            if [ ! -d "$TARGET_PATH" ]; then
              echo "❌ 错误: 目标目录不存在"
              exit 1
            fi

            if [ -z "$(ls -A $TARGET_PATH)" ]; then
              echo "❌ 错误: 目标目录为空"
              exit 1
            fi

            FILE_COUNT=$(find $TARGET_PATH -type f 2>/dev/null | wc -l)
            TOTAL_SIZE=$(du -sh $TARGET_PATH 2>/dev/null | awk '{print $1}')

            echo "📊 服务器上部署状态:"
            echo "  - 文件数: $FILE_COUNT"
            echo "  - 总大小: $TOTAL_SIZE"

            if [ -f "$TARGET_PATH/index.html" ]; then
              echo "  ✅ index.html 存在"
            else
              echo "  ⚠️ 警告: index.html 不存在"
            fi

            echo "✅ 部署验证通过"
          EOF

          echo "========================================"

      # ---------- 20. 健康检查 ----------
      - name: 健康检查
        if: steps.deploy-condition.outputs.should_deploy == 'true'
        run: |
          echo "========================================"
          echo "🏥 健康检查"
          echo "========================================"

          HOST="${{ secrets.SERVER_HOST }}"
          echo "检查: https://${HOST}"

          sleep 5

          for protocol in https http; do
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" "${protocol}://${HOST}" 2>/dev/null || echo "000")
            if [ "$HTTP_CODE" = "200" ] || [ "$HTTP_CODE" = "301" ] || [ "$HTTP_CODE" = "302" ]; then
              echo "✅ 健康检查通过 (${protocol}://${HOST} HTTP $HTTP_CODE)"
              exit 0
            fi
            echo "尝试 ${protocol}://${HOST} 返回: HTTP $HTTP_CODE"
          done

          echo "⚠️ 健康检查未返回200/301/302，请手动确认服务状态"
          exit 0

      # ---------- 21. 生成部署报告 ----------
      - name: 生成部署报告
        if: always()
        run: |
          echo "## 📊 部署报告" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| 项目 | 详情 |" >> $GITHUB_STEP_SUMMARY
          echo "|------|------|" >> $GITHUB_STEP_SUMMARY
          echo "| 构建ID | \`${{ steps.vars.outputs.build_id }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| 提交 | \`${{ steps.vars.outputs.short_hash }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| 触发方式 | ${{ github.event_name }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 触发者 | ${{ github.actor }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 构建状态 | ${{ steps.build.outputs.status == 'success' && '✅ 成功' || '❌ 失败' }} |" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.build.outputs.status }}" == "success" ]; then
            echo "| 构建耗时 | ${{ steps.build.outputs.duration }}秒 |" >> $GITHUB_STEP_SUMMARY
            echo "| 产物大小 | ${{ steps.build.outputs.size }} |" >> $GITHUB_STEP_SUMMARY
          fi
          if [ "${{ steps.deploy-condition.outputs.should_deploy }}" == "true" ]; then
            echo "| 部署状态 | ✅ 已部署到 ${{ secrets.SERVER_HOST }} |" >> $GITHUB_STEP_SUMMARY
          elif [ "${{ github.event_name }}" == "pull_request" ]; then
            echo "| 部署状态 | ⏭️ PR模式，跳过部署 |" >> $GITHUB_STEP_SUMMARY
          elif [ "${{ github.ref }}" != "refs/heads/main" ] && [ "${{ github.ref }}" != "refs/heads/master" ]; then
            echo "| 部署状态 | ⏭️ 非main分支，跳过部署 |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| 部署状态 | ⏭️ 跳过部署 |" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.build.outputs.status }}" == "success" ] && [ "${{ steps.deploy-condition.outputs.should_deploy }}" == "true" ]; then
            echo "> 🎉 构建并部署完成！" >> $GITHUB_STEP_SUMMARY
          elif [ "${{ steps.build.outputs.status }}" == "success" ]; then
            echo "> ✅ 构建完成！" >> $GITHUB_STEP_SUMMARY
          else
            echo "> ❌ 构建失败，请查看日志" >> $GITHUB_STEP_SUMMARY
          fi

      # ---------- 22. 清理 Docker ----------
      - name: 清理 Docker
        if: always()
        run: |
          docker system prune -f 2>/dev/null || true
          echo "✅ Docker 清理完成"